<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 背景 -->
  <rect width="100" height="100" fill="#0a1f2a"/>

  <!-- 圆形边框 -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#d4a84b" stroke-width="2"/>

  <!-- 宋字（简化版） -->
  <text x="50" y="55"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="serif"
        font-size="40"
        font-weight="bold"
        fill="#f5f0e8">宋</text>

  <!-- 装饰点 -->
  <circle cx="50" cy="25" r="3" fill="#c94043"/>
  <circle cx="50" cy="75" r="3" fill="#c94043"/>
</svg>